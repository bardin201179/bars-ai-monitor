name: Bars AI healthcheck

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить сайт
        id: check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://bardinsa.ru/ai-agent/api/health || echo 000)
          echo "Код ответа: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "Сайт отвечает"
          else
            echo "Сайт не отвечает"
            exit 1
          fi