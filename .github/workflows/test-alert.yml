name: test-alert

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Отправить тестовый алерт
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          text="🔔 Тест алертов Bars AI%0AТак будет выглядеть сообщение, если сайт перестанет отвечать.%0AЕсли вы это получили — канал работает."
          resp=$(curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -d "chat_id=$CHAT" -d "text=$text")
          echo "$resp" | head -c 400
          echo
          echo "$resp" | grep -q '"ok":true' || { echo "Telegram отклонил сообщение"; exit 1; }